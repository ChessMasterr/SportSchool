services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sport_school
      POSTGRES_USER: sport_school
      POSTGRES_PASSWORD: sport_school
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sport_school"]
      interval: 5s
      timeout: 5s
      retries: 5
  backend:
    build: ./back
    env_file: ./back/.env.example
    ports:
      - "8003:8000"
    environment:
      POSTGRES_HOST: db
    volumes:
      - media_data:/app/media
    depends_on:
      db:
        condition: service_healthy
  frontend:
    build: ./front
    ports:
      - "13444:80"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.schedule-web.rule=Host(`ais.azathd.ru`)"
      - "traefik.http.routers.schedule-web.entrypoints=websecure"
      - "traefik.http.routers.schedule-web.tls.certresolver=le"
      - "traefik.http.services.schedule-web.loadbalancer.server.port=80"
    networks:
      - default
      - proxy
    depends_on:
      - backend

volumes:
  postgres_data:
  media_data:

networks:
  proxy:
    external: true